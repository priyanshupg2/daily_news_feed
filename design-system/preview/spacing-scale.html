<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<title>Spacing scale</title>
<style>
.sp-row { display: grid; grid-template-columns: 60px 80px 1fr; align-items: center; gap: 16px; padding: 4px 0; }
.sp-name { font-family: var(--font-mono); font-size: 11px; color: var(--prism-ink); }
.sp-val  { font-family: var(--font-mono); font-size: 11px; color: var(--prism-ink-3); }
.sp-bar  { height: 14px; background: var(--lens-engineer); border-radius: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="sp-row"><div class="sp-name">--s-1</div><div class="sp-val">4 px</div><div class="sp-bar" style="width: 4px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-2</div><div class="sp-val">8 px</div><div class="sp-bar" style="width: 8px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-3</div><div class="sp-val">12 px</div><div class="sp-bar" style="width: 12px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-4</div><div class="sp-val">16 px</div><div class="sp-bar" style="width: 16px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-5</div><div class="sp-val">20 px</div><div class="sp-bar" style="width: 20px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-6</div><div class="sp-val">24 px</div><div class="sp-bar" style="width: 24px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-7</div><div class="sp-val">32 px</div><div class="sp-bar" style="width: 32px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-8</div><div class="sp-val">40 px</div><div class="sp-bar" style="width: 40px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-9</div><div class="sp-val">48 px</div><div class="sp-bar" style="width: 48px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-10</div><div class="sp-val">64 px</div><div class="sp-bar" style="width: 64px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-11</div><div class="sp-val">80 px</div><div class="sp-bar" style="width: 80px;"></div></div>
  <div class="sp-row"><div class="sp-name">--s-12</div><div class="sp-val">120 px</div><div class="sp-bar" style="width: 120px;"></div></div>
</div>
</body>
</html>
