<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<title>Lens chips</title>
<style>
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px 5px 8px;
  border-radius: var(--r-pill);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.chip-dot { width: 6px; height: 6px; border-radius: 999px; flex: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.row { padding: 6px 0; }
.row-label { font-family: var(--font-sans); font-size: 11px; color: var(--prism-ink-3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.12em; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="row-label">Soft chip — default tagging</div>
    <div class="chips">
      <span class="chip" style="background: var(--lens-founder-soft); color: var(--lens-founder-ink);"><span class="chip-dot" style="background: var(--lens-founder);"></span>Founder</span>
      <span class="chip" style="background: var(--lens-investor-soft); color: var(--lens-investor-ink);"><span class="chip-dot" style="background: var(--lens-investor);"></span>Investor</span>
      <span class="chip" style="background: var(--lens-researcher-soft); color: var(--lens-researcher-ink);"><span class="chip-dot" style="background: var(--lens-researcher);"></span>Researcher</span>
      <span class="chip" style="background: var(--lens-engineer-soft); color: var(--lens-engineer-ink);"><span class="chip-dot" style="background: var(--lens-engineer);"></span>Engineer</span>
      <span class="chip" style="background: var(--lens-operator-soft); color: var(--lens-operator-ink);"><span class="chip-dot" style="background: var(--lens-operator);"></span>Operator</span>
    </div>
  </div>
  <div class="row" style="margin-top: 14px;">
    <div class="row-label">Solid chip — selected state</div>
    <div class="chips">
      <span class="chip" style="background: var(--lens-founder); color: white;">Founder</span>
      <span class="chip" style="background: var(--lens-investor); color: white;">Investor</span>
      <span class="chip" style="background: var(--lens-researcher); color: white;">Researcher</span>
    </div>
  </div>
  <div class="row" style="margin-top: 14px;">
    <div class="row-label">Neutral chip — metadata</div>
    <div class="chips">
      <span class="chip" style="background: var(--prism-paper-2); color: var(--prism-ink-2);">12 sources</span>
      <span class="chip" style="background: var(--prism-paper-2); color: var(--prism-ink-2);">4 min read</span>
      <span class="chip" style="background: var(--prism-paper-2); color: var(--prism-ink-2);">explainer · delta</span>
    </div>
  </div>
</div>
</body>
</html>
