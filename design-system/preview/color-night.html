<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<title>Night surfaces</title>
</head>
<body>
<div class="card" style="background: var(--prism-night); color: var(--prism-night-fg);">
  <div style="display: flex; gap: 14px; align-items: center; margin-bottom: 14px;">
    <div style="width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--prism-night-2); border: 1px solid var(--prism-night-3);"></div>
    <div>
      <div style="font-family: var(--font-display); font-style: italic; font-size: 22px; color: var(--prism-night-fg);">Now reading</div>
      <div style="font-family: var(--font-sans); font-size: 12px; color: var(--prism-night-fg-2); margin-top: 2px;">Used for focus mode and brand strips, not as a global dark theme.</div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
    <div style="background: var(--prism-night); border: 1px solid var(--prism-night-3); padding: 8px; border-radius: var(--r-sm);">
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--prism-night-fg-2);">night</div>
      <div style="font-family: var(--font-mono); font-size: 9px; color: var(--prism-night-fg-2);">#0E0D0B</div>
    </div>
    <div style="background: var(--prism-night-2); border: 1px solid var(--prism-night-3); padding: 8px; border-radius: var(--r-sm);">
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--prism-night-fg-2);">night-2</div>
      <div style="font-family: var(--font-mono); font-size: 9px; color: var(--prism-night-fg-2);">#1A1916</div>
    </div>
    <div style="background: var(--prism-night-3); border: 1px solid var(--prism-night-3); padding: 8px; border-radius: var(--r-sm);">
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--prism-night-fg);">night-3</div>
      <div style="font-family: var(--font-mono); font-size: 9px; color: var(--prism-night-fg-2);">#2A2924</div>
    </div>
    <div style="background: var(--prism-night-fg); border: 1px solid var(--prism-night-3); padding: 8px; border-radius: var(--r-sm);">
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--prism-night);">night-fg</div>
      <div style="font-family: var(--font-mono); font-size: 9px; color: var(--prism-night);">#F5F1E8</div>
    </div>
  </div>
</div>
</body>
</html>
