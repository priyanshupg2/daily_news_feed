<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<title>Spectrum bar</title>
</head>
<body>
<div class="card">
  <div class="p-eyebrow" style="margin-bottom: 12px;">Spectrum bar — used as brief header, brand strip</div>
  <div style="background: var(--prism-card); border: 1px solid var(--prism-hairline); border-radius: var(--r-md); padding: 0; overflow: hidden;">
    <div style="height: 3px; background: linear-gradient(90deg, var(--lens-founder) 0%, var(--lens-investor) 25%, var(--lens-researcher) 50%, var(--lens-engineer) 75%, var(--lens-operator) 100%);"></div>
    <div style="padding: 18px 22px;">
      <div class="p-eyebrow" style="margin-bottom: 6px;">Tuesday · 25 May 2026 · 06:00</div>
      <div class="p-h3" style="margin: 0;">Today's briefs · 5 lenses, 14 minutes</div>
    </div>
  </div>
  <div style="margin-top: 14px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--lens-founder) 0%, var(--lens-investor) 25%, var(--lens-researcher) 50%, var(--lens-engineer) 75%, var(--lens-operator) 100%);"></div>
</div>
</body>
</html>
